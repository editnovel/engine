[package]
name = "editnovel-engine"
version = "0.1.0"
edition = "2024"
description = "Deterministic Rust editorial engine for PDF/EPUB parsing, cleaning, dHash image filtering, spell checking, and EPUB 3 packaging."

[lib]
crate-type = ["rlib"]

[features]
default = ["embedded-dicts"]
embedded-dicts = []
parallel = ["dep:rayon"]

[dependencies]
aho-corasick = "1.1.5"
brotli = "9.1.3"
image = { version = "0.25.10", features = ["png", "jpeg", "webp"], default-features = false }
img_hash = "3.2.0"
lol_html = "3.0.3"
lopdf = "0.45.0"
pdf_oxide = "0.3.78"
quick-xml = "0.42.0"
rayon = { version = "1.12.0", optional = true }
rc-zip = { version = "5.4.1", features = ["deflate"] }
rc-zip-sync = { version = "4.4.2", features = ["deflate"], default-features = false }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symspell = "0.5.2"
unicode-normalization = "0.1.26"
unicode-segmentation = "1.13.3"
zip = { version = "9.0.3", default-features = false, features = ["deflate"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1.12.0"
